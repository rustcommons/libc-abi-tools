[package]
name = "kernel-abi-tools"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"
description = "Linux kernel ABI data and seccomp profiles that simulate older kernels when testing Rust binaries"
repository = "https://github.com/rustcommons/linux-abi-tools"
license = "MIT"
readme = "README.md"
keywords = ["seccomp", "linux", "kernel", "syscall", "compatibility"]
categories = ["development-tools::testing", "os::linux-apis"]
include = ["src/**", "data/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
name = "kernel_abi_tools"
path = "src/lib.rs"

[[bin]]
name = "kernel-seccomp"
path = "src/bin/kernel-seccomp.rs"

[[bin]]
name = "syscall-probe"
path = "src/bin/syscall-probe.rs"

[dependencies]
linux-targets = { path = "../linux-targets", version = "0.3.0" }
