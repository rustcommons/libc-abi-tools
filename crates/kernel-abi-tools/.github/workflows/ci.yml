name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked --offline
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
      - name: Committed profiles match the data
        shell: bash
        run: |
          cargo run --release --locked --offline --bin kernel-seccomp -- generate profiles
          git diff --exit-code -- profiles
  kernel-simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: shellcheck -S warning scripts/*.sh
      - name: Package and verify the release bundle
        run: |
          bash scripts/package-release.sh "$RUNNER_TEMP/dist"
          mkdir "$RUNNER_TEMP/bundle"
          tar -xzf "$RUNNER_TEMP"/dist/*.tar.gz -C "$RUNNER_TEMP/bundle"
          echo "BUNDLE=$(ls -d "$RUNNER_TEMP"/bundle/kernel-abi-tools-*)" >> "$GITHUB_ENV"
      - run: '"$BUNDLE/bin/kernel-seccomp" verify-bundle "$BUNDLE"'
      - name: Static crun (libseccomp that names every syscall)
        run: bash scripts/install-crun.sh "$RUNNER_TEMP/crun"
      - name: Self-test every profile from the bundle in SLES 12 SP5 userland
        env:
          KERNEL_ABI_ENGINE_ARGS: --runtime ${{ runner.temp }}/crun
        run: >-
          bash "$BUNDLE/scripts/self-test.sh" "$BUNDLE/bin/syscall-probe"
          registry.suse.com/suse/sles12sp5:latest
          $(cd "$BUNDLE/profiles/kernel" && ls | sed 's/^linux-//; s/\.json$//' | sort -V)
          sles-12-sp5 rhel-7 ubuntu-24.04
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-abi-tools-bundle
          path: ${{ runner.temp }}/dist/
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo check --all-targets --locked --offline
