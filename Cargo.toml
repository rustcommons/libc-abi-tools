[package]
name = "libc-abi-tools"
version = "0.3.1"
edition = "2021"
rust-version = "1.90"
description = "Rust tools for libc ABI metadata, starting with glibc"
repository = "https://github.com/rustcommons/linux-abi-tools"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/libc-abi-tools"
keywords = ["glibc", "abi", "linker", "symbols", "compatibility"]
categories = ["development-tools::build-utils"]
# glibc's ABI lists come from the glibc-abilists crate (see [features]).
# Container mode runs the pinned build scripts of examples/glibc-*/.
include = [
    "/src/**",
    "/examples/glibc-2.*/INPUTS.toml",
    "/examples/glibc-2.*/build-inputs.sh",
    "/examples/glibc-two-paths/build-inputs.sh",
    "/examples/glibc-two-paths/run.sh",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/LICENSES/**",
    "/NOTICE.md",
]

[lib]
name = "libc_abi_tools"

[[bin]]
name = "libc-abi"
path = "src/main.rs"

[features]
default = ["bundled-glibc-data", "provider-sources"]
# Compiles in the GNU C Library's ABI lists from the glibc-abilists crate
# (LGPL-2.1-or-later). Without it, data is read from a directory (--data).
bundled-glibc-data = ["dep:glibc-abilists"]
# Source mode: the recorded glibc sources of glibc-provider-sources (LGPL-2.1-or-later
# and the Linux UAPI headers' licenses), compiled locally with the host's GCC.
provider-sources = ["dep:glibc-provider-sources"]

[dependencies]
glibc-abilists = { version = "0.1.0", optional = true }
glibc-provider-sources = { version = "0.1.0", optional = true }

# The root package stays libc-abi-tools; `cargo` commands run in the root act
# on it alone unless given `--workspace` or `-p`.
[workspace]
members = [
    "crates/kernel-abi-tools",
    "crates/linux-abi-scan",
    "crates/linux-abi-tools",
    "crates/linux-targets",
]
resolver = "2"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true
