[package]
name = "libc-abi-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Rust tools for libc ABI metadata, starting with glibc"
repository = "https://github.com/rustcommons/linux-abi-tools"
license = "MIT"
readme = "README.md"
keywords = ["glibc", "abi", "linker", "symbols", "compatibility"]
categories = ["development-tools::build-utils"]
# The glibc ABI lists under data/ (GPL-2.0, see NOTICE.md) are read from a
# checkout at run time and are not part of the published crate.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "LICENSES/**", "NOTICE.md"]

[lib]
name = "libc_abi_tools"

[[bin]]
name = "libc-abi"
path = "src/main.rs"

[dependencies]

# The root package stays libc-abi-tools; `cargo` commands run in the root act
# on it alone unless given `--workspace` or `-p`.
[workspace]
members = [
    "crates/kernel-abi-tools",
    "crates/linux-abi-tools",
    "crates/linux-targets",
]
resolver = "2"
