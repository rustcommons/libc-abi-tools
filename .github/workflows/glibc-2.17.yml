name: glibc provider integration
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      companion_ref:
        description: cargo-libc integration branch or tested commit
        required: false
        default: ce9a7d51122f143091050d9e53b1222b77e67de1
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare and audit glibc ${{ matrix.glibc }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        glibc: ['2.17', '2.18', '2.19', '2.20', '2.21', '2.22', '2.23', '2.24', '2.25', '2.26', '2.27', '2.28', '2.29', '2.30', '2.31', '2.32', '2.33', '2.34', '2.35', '2.36', '2.37', '2.38', '2.39', '2.40', '2.41', '2.42', '2.43', '2.44']
    env:
      ABI_GLIBC_RELEASE: ${{ matrix.glibc }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Fetch dependencies and export the glibc ABI lists
        run: |
          cargo fetch --locked
          cargo run --locked --offline --bin libc-abi -- glibc export-data --output data/glibc
          echo "ABI_PROVIDER_CACHE=$RUNNER_TEMP/providers" >> "$GITHUB_ENV"
      - name: Install preparation tools
        run: sudo apt-get update && sudo apt-get install -y podman make python3 gcc binutils
      - name: Check the recorded GCC 4.8.5 libgcc_s interface against CentOS 7's library
        if: matrix.glibc == '2.17'
        run: bash scripts/record-libgcc-s.sh --check
      # Container mode runs the pinned build (the same script, image and archive as
      # examples/glibc-*/run.sh) and keeps its work tree, which every later step
      # audits: the qualified build is container mode's own.
      - name: Build pinned target inputs once per release, in container mode
        run: |
          work="$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
          cargo run --locked --offline --bin libc-abi -- provider prepare --glibc "$ABI_GLIBC_RELEASE" \
            --mode container --cache "$ABI_PROVIDER_CACHE" --keep-work "$work"
          if [ "$ABI_GLIBC_RELEASE" = 2.17 ]; then
            cp examples/glibc-two-paths/hello.c examples/glibc-two-paths/link-and-check.sh "$work/"
            bash examples/glibc-two-paths/link-and-check.sh "$work"
          fi
      - name: Audit native metadata, generated exports, and every matrix interface
        run: |
          bash examples/glibc-two-paths/elf-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
          bash examples/glibc-two-paths/prepare-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
      - name: Compare the source-mode provider with this container build
        run: bash examples/glibc-two-paths/source-mode-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
      - name: Compare the container-mode and source-mode providers, export container mode
        run: |
          bash examples/glibc-two-paths/modes-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE" \
            "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE-container-provider.tar"
      - name: Package qualified CI inputs
        run: |
          python3 examples/glibc-two-paths/ci-bundle.py pack "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE" "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE.tar.gz"
      - name: Upload prepared provider inputs
        uses: actions/upload-artifact@v7
        with:
          name: glibc-${{ matrix.glibc }}-prepared-inputs
          compression-level: 0
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}.tar.gz
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}.tar.gz.sha256
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}-container-provider.tar
      - name: Retain preparation diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glibc-${{ matrix.glibc }}-preparation-diagnostics
          path: |
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/logs
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/elf-metadata
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/link-matrix
  application:
    name: Rust 1.99 and Clang ${{ matrix.clang }} / glibc ${{ matrix.glibc }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        clang: [21, 24]
        glibc: ['2.17', '2.18', '2.19', '2.20', '2.21', '2.22', '2.23', '2.24', '2.25', '2.26', '2.27', '2.28', '2.29', '2.30', '2.31', '2.32', '2.33', '2.34', '2.35', '2.36', '2.37', '2.38', '2.39', '2.40', '2.41', '2.42', '2.43', '2.44']
    env:
      ABI_GLIBC_RELEASE: ${{ matrix.glibc }}
      ABI_BEHAVIOR_CC: /usr/bin/clang-${{ matrix.clang }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: libc-abi-tools
      - uses: actions/checkout@v7
        with:
          repository: rustcommons/cargo-libc
          path: cargo-libc
          ref: ${{ inputs.companion_ref || 'ce9a7d51122f143091050d9e53b1222b77e67de1' }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install application tools
        env:
          CLANG_MAJOR: ${{ matrix.clang }}
        run: |
          bash libc-abi-tools/.github/install-clang.sh "$CLANG_MAJOR"
          sudo apt-get install -y python3 gcc binutils
      - uses: actions/download-artifact@v8
        with:
          name: glibc-${{ matrix.glibc }}-prepared-inputs
          path: ${{ runner.temp }}/prepared-inputs
      - name: Fetch dependencies and export the glibc ABI lists
        working-directory: libc-abi-tools
        run: |
          cargo fetch --locked
          cargo run --locked --offline --bin libc-abi -- glibc export-data --output data/glibc
      - name: Verify and restore provider inputs into this runner
        working-directory: libc-abi-tools
        run: |
          python3 examples/glibc-two-paths/ci-bundle.py unpack "$RUNNER_TEMP/prepared-inputs/glibc-$ABI_GLIBC_RELEASE.tar.gz" "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
      - name: Import the container-mode provider and prepare the source-mode one
        working-directory: libc-abi-tools
        run: |
          echo "ABI_PROVIDER_CACHE=$RUNNER_TEMP/providers" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/container-provider"
          tar -C "$RUNNER_TEMP/container-provider" -xf "$RUNNER_TEMP/prepared-inputs/glibc-$ABI_GLIBC_RELEASE-container-provider.tar"
          cargo run --locked --offline --bin libc-abi -- provider import "$RUNNER_TEMP/container-provider" \
            --cache "$RUNNER_TEMP/providers"
          cargo run --locked --offline --bin libc-abi -- provider prepare --glibc "$ABI_GLIBC_RELEASE" \
            --cache "$RUNNER_TEMP/providers"
          cargo run --locked --offline --bin libc-abi -- provider list --cache "$RUNNER_TEMP/providers"
      - name: Build Rust and C applications, then run only real runtimes
        working-directory: libc-abi-tools
        env:
          # The Cargo suite also runs against the provider of each delivery mode.
          ABI_PROVIDER_MODES: source container
        run: |
          bash examples/glibc-two-paths/application-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
          bash examples/glibc-two-paths/provider-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE" "$GITHUB_WORKSPACE/cargo-libc" "$ABI_BEHAVIOR_CC"
      - name: Retain application diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: glibc-${{ matrix.glibc }}-clang-${{ matrix.clang }}-application-diagnostics
          path: |
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/logs
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/behavior
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/provider-*-v1-*.txt
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/bundle-manifest.json
            ${{ runner.temp }}/modern-toolchain.txt
