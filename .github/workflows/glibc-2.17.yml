name: glibc provider integration
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      companion_ref:
        description: cargo-libc integration branch or tested commit
        required: false
        default: 695ac536a791650d0d351c74562e008c47a82392
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        clang: [21, 24]
        glibc: ['2.17', '2.22']
    env:
      ABI_GLIBC_RELEASE: ${{ matrix.glibc }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: libc-abi-tools
      - uses: actions/checkout@v4
        with:
          repository: rustcommons/cargo-libc
          path: cargo-libc
          # Pin the companion provider contract tested with this workflow.
          ref: ${{ inputs.companion_ref || '695ac536a791650d0d351c74562e008c47a82392' }}
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Install explicit modern Clang and Linux build tools
        env:
          CLANG_MAJOR: ${{ matrix.clang }}
        run: |
          bash libc-abi-tools/.github/install-clang.sh "$CLANG_MAJOR"
          sudo apt-get install -y podman make python3
      - name: Test companion and build pinned target inputs
        run: |
          cd cargo-libc
          cargo fmt --all -- --check
          cargo test --all-targets --locked --offline
          cargo clippy --all-targets --locked --offline -- -D warnings
          cd ../libc-abi-tools
          if [ "$ABI_GLIBC_RELEASE" = 2.17 ]; then
            bash examples/glibc-two-paths/run.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
          else
            bash examples/glibc-2.22/run.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
          fi
      - name: Check metadata, complete stubs, and Cargo integration
        env:
          CLANG_MAJOR: ${{ matrix.clang }}
        working-directory: libc-abi-tools
        run: |
          bash examples/glibc-two-paths/elf-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
          bash examples/glibc-two-paths/full-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE"
          bash examples/glibc-two-paths/provider-and-check.sh "$RUNNER_TEMP/glibc-$ABI_GLIBC_RELEASE" "$GITHUB_WORKSPACE/cargo-libc" "/usr/bin/clang-$CLANG_MAJOR"
      - name: Retain diagnostics even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glibc-${{ matrix.glibc }}-clang-${{ matrix.clang }}-diagnostics
          path: |
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/logs
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/elf-metadata
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/link-matrix
            ${{ runner.temp }}/glibc-${{ matrix.glibc }}/provider-*-v1-*.txt
            ${{ runner.temp }}/modern-toolchain.txt
