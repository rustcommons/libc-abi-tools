name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      # glibc-abilists is a git dependency until it is on crates.io.
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked --offline
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
      - name: Without the bundled glibc data (opt-out)
        run: |
          cargo test --all-targets --locked --offline --no-default-features
          cargo clippy --all-targets --locked --offline --no-default-features -- -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo fetch --locked
      - run: cargo check --all-targets --locked --offline
  history:
    name: ABI matrix and user reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo fetch --locked
      - run: cargo build --locked --offline
      - name: Export the glibc ABI lists from glibc-abilists
        run: target/debug/libc-abi glibc export-data --output data/glibc
      - name: Verify regenerated matrix and Markdown reference
        run: python3 scripts/build-glibc-reference.py --binary target/debug/libc-abi --check
      - name: Verify CI bundle integrity and extraction fixtures
        run: python3 examples/glibc-two-paths/test-ci-bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: glibc-history-reference
          path: |
            data/glibc-history
            docs/reference
  snapshots:
    name: glibc ${{ matrix.glibc }} ABI snapshot
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        glibc: ['2.17', '2.18', '2.19', '2.20', '2.21', '2.22', '2.23', '2.24', '2.25', '2.26', '2.27', '2.28', '2.29', '2.30', '2.31', '2.32', '2.33', '2.34', '2.35', '2.36', '2.37', '2.38', '2.39', '2.40', '2.41', '2.42', '2.43', '2.44']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo fetch --locked
      - name: Bundled and exported data agree; export is deterministic
        env:
          GLIBC_RELEASE: ${{ matrix.glibc }}
        run: |
          cargo build --locked --offline
          target/debug/libc-abi glibc export-data --output data/glibc
          target/debug/libc-abi glibc snapshot --release "$GLIBC_RELEASE" > first.tsv
          target/debug/libc-abi glibc snapshot --data data/glibc --release "$GLIBC_RELEASE" > second.tsv
          test -s first.tsv
          cmp first.tsv second.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: glibc-${{ matrix.glibc }}-snapshot
          path: first.tsv
