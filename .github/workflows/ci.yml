name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked --offline
      - run: cargo clippy --all-targets --locked --offline -- -D warnings
      - name: Committed profiles match the data
        shell: bash
        run: |
          cargo run --release --locked --offline --bin kernel-seccomp -- generate profiles
          git diff --exit-code -- profiles
  kernel-simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo build --release --locked --offline
      - name: Container runtime
        run: |
          command -v crun >/dev/null || { sudo apt-get update && sudo apt-get install -y crun; }
          podman version --format '{{.Client.Version}}'
          crun --version
          dpkg-query -W libseccomp2
      - name: Self-test profiles under crun
        # Ubuntu 24.04 ships libseccomp 2.5.5, which does not know syscalls
        # added in Linux 6.8 and later; those profiles fail closed there and
        # are verified locally with libseccomp 2.6 (see README).
        env:
          KERNEL_ABI_ENGINE_ARGS: --runtime crun
        run: >-
          bash scripts/self-test.sh target/release/syscall-probe docker.io/library/ubuntu:24.04
          3.10 3.16 4.4 4.9 4.12 4.14 4.15 4.18 4.19 5.3 5.4 5.10 5.14 5.15 6.1 6.4 6.6
          sles-12-sp5
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo check --all-targets --locked --offline
