name: kernel-abi-tools
# CI for crates/kernel-abi-tools and crates/linux-targets. The glibc
# workflows cover the root libc-abi-tools package.
on:
  push:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kernel-abi-tools*.yml
  pull_request:
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/kernel-abi-tools*.yml
permissions:
  contents: read
env:
  CRATES: -p kernel-abi-tools -p linux-targets -p linux-abi-tools
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fetch --locked
      - run: cargo fmt --all -- --check
      - shell: bash
        run: cargo test $CRATES --all-targets --locked --offline
      - shell: bash
        run: cargo clippy $CRATES --all-targets --locked --offline -- -D warnings
      - name: Committed profiles match the data
        shell: bash
        working-directory: crates/kernel-abi-tools
        run: |
          cargo run -p kernel-abi-tools --release --locked --offline --bin kernel-seccomp -- generate profiles
          git diff --exit-code -- profiles
  kernel-simulation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/kernel-abi-tools
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo fetch --locked
      - run: shellcheck -S warning scripts/*.sh
      - name: Build the static musl probe and the generator
        run: |
          cargo build --release --locked --offline --target x86_64-unknown-linux-musl -p kernel-abi-tools --bin syscall-probe
          cargo build --release --locked --offline -p kernel-abi-tools --bin kernel-seccomp
          echo "PROBE=$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/release/syscall-probe" >> "$GITHUB_ENV"
      - name: Self-test every profile with the local filter (host userland, no root)
        run: >-
          bash scripts/self-test.sh "$PROBE" local
          $(cd profiles/kernel && ls | sed 's/^linux-//; s/\.json$//' | sort -V)
          $(cd profiles/distro && ls | sed 's/\.json$//')
      - name: Static crun (libseccomp that names every syscall)
        run: bash scripts/install-crun.sh "$RUNNER_TEMP/crun"
      - name: Self-test every profile in SLES 12 SP5 userland
        env:
          KERNEL_ABI_ENGINE_ARGS: --runtime ${{ runner.temp }}/crun
        run: >-
          bash scripts/self-test.sh "$PROBE"
          registry.suse.com/suse/sles12sp5:latest
          $(cd profiles/kernel && ls | sed 's/^linux-//; s/\.json$//' | sort -V)
          sles-12-sp5 rhel-7 ubuntu-24.04
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo fetch --locked
      - run: cargo check -p kernel-abi-tools -p linux-targets -p linux-abi-tools --all-targets --locked --offline
